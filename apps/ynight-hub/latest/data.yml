additionalProperties:
  formFields:
    - envKey: PANEL_APP_PORT_HTTP
      default: 3003
      labelZh: 本机 HTTP 端口
      labelEn: Local HTTP port
      type: number
      rule: paramPort
      required: true
      edit: true
    - envKey: REDIS_HOST
      default: ''
      key: redis
      labelZh: Redis 服务
      labelEn: Redis service
      type: service
      required: true
      edit: true
    - envKey: REDIS_PORT
      default: 6379
      labelZh: Redis 端口
      labelEn: Redis port
      type: number
      rule: paramPort
      required: true
      edit: true
    - envKey: REDIS_DB
      default: 0
      labelZh: Redis 库号
      labelEn: Redis database
      type: number
      required: true
      edit: true
    - envKey: PANEL_REDIS_ROOT_PASSWORD
      default: ''
      labelZh: Redis 密码（选择服务后自动填充）
      labelEn: Redis password (auto-filled from service)
      type: password
      required: false
      edit: true
    - envKey: PANEL_DB_HOST
      default: ''
      key: mysql
      labelZh: MySQL 服务
      labelEn: MySQL service
      type: service
      required: true
    - envKey: PANEL_DB_NAME
      default: ynight
      labelZh: MySQL 数据库名
      labelEn: MySQL database name
      type: text
      random: true
      rule: paramCommon
      required: true
    - envKey: PANEL_DB_USER
      default: ynight
      labelZh: MySQL 用户名
      labelEn: MySQL username
      type: text
      random: true
      rule: paramCommon
      required: true
    - envKey: PANEL_DB_USER_PASSWORD
      default: ynight
      labelZh: MySQL 密码
      labelEn: MySQL password
      type: password
      random: true
      rule: paramComplexity
      required: true
