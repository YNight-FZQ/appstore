    default: 8790
    labelZh: HTTP 端口
    labelEn: HTTP port
    description:
      zh: 看板与 API 共用此端口；默认绑定 127.0.0.1，可通过反向代理访问。最终绑定地址请核对 1Panel 高级设置。
      en: Shared dashboard and API port; defaults to 127.0.0.1. Verify the final bind
