services:
  tavily-proxy:
    image: ghcr.io/xuncv/tavilyproxymanager:latest
    container_name: ${CONTAINER_NAME}
    working_dir: /app
    command: ["./tavily-proxy"]
    environment:
      DATABASE_PATH: /app/data/proxy.db
    ports:
      - '127.0.0.1:${PANEL_APP_PORT_HTTP}:8080'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
