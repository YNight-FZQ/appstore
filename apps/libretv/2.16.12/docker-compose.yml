services:
  libretv:
    image: bestzwei/libretv:2.16.12
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PANEL_APP_PORT_HTTP}:8080'
    environment:
      PASSWORD: ${PASSWORD:?请在安装表单中设置访问密码}
      PROXY_SECRET: ${PROXY_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      DEFAULT_SOURCES: ${DEFAULT_SOURCES:-[]}
      DEFAULT_LIVE_SOURCES: ${DEFAULT_LIVE_SOURCES:-[]}
      DEFAULT_SUBSCRIPTIONS: ${DEFAULT_SUBSCRIPTIONS:-[]}
      DEFAULT_RECOMMEND_SOURCE: ${DEFAULT_RECOMMEND_SOURCE:-hot-list}
      LIVE_ALLOW_PRIVATE: ${LIVE_ALLOW_PRIVATE:-0}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/api/status', { signal: AbortSignal.timeout(3000) })
          .then(async response => process.exit(response.ok && (await response.json()).passwordRequired ? 0 : 1))
          .catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - 1panel-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      createdBy: Apps

networks:
  1panel-network:
    external: true
