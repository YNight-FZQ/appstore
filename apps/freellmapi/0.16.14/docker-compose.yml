services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.14
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    env_file:
    - ./conf/app.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      FREEAPI_DB_PATH: /app/server/data/freellmapi.db
      ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS}
      TRUST_PROXY: ${APP_TRUST_PROXY}
    ports:
    - 127.0.0.1:${PANEL_APP_PORT_HTTP}:3001
    volumes:
    - ./data:/app/server/data
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
      com.centurylinklabs.watchtower.enable: 'false'
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3001/api/ping').then(r => { if (!r.ok) process.exit(1);
        }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
networks:
  1panel-network:
    external: true
