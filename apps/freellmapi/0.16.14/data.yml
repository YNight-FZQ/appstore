additionalProperties:
  formFields:
  - envKey: PANEL_APP_PORT_HTTP
    default: 3001
    labelZh: HTTP 端口
    labelEn: HTTP port
    description:
      zh: 看板和 API 共用端口，默认绑定宿主机回环地址；请同时核对 1Panel 高级设置。
      en: Shared dashboard/API port, published on host loopback by default; also verify
        1Panel advanced settings.
    type: number
    rule: paramPort
    required: true
    edit: true
  - envKey: APP_ALLOWED_HOSTS
    default: localhost
    labelZh: 允许访问的主机名
    labelEn: Allowed hostnames
    description:
      zh: 使用反向代理时填实际域名；多个主机名以逗号分隔，不带协议和端口。回环地址始终允许。
      en: For a reverse proxy, enter the actual hostname. Separate multiple hosts
        with commas; omit schemes and ports. Loopback hosts are always allowed.
    type: text
    required: true
    edit: true
  - envKey: APP_TRUST_PROXY
    default: 'false'
    labelZh: 信任的反向代理
    labelEn: Trusted reverse proxy
    description:
      zh: 默认 false；单层可信反代可填 1，也可填代理 IP/CIDR。需与实际网络拓扑一致。
      en: Defaults to false; use 1 for one trusted proxy hop, or explicit proxy IPs/CIDRs
        matching your network.
    type: text
    required: true
    edit: true
