services:
  subconverter:
    image: tindy2013/subconverter:latest
    container_name: ${CONTAINER_NAME}
    ports:
      - '127.0.0.1:${PANEL_APP_PORT_HTTP}:25500'
    networks:
      - 1panel-network
    volumes:
      - ./conf/pref.toml:/base/pref.toml
      - ./conf/auto_speed_test.ini:/base/config/auto_speed_test.ini
      - ./groups.toml:/base/snippets/groups.toml:ro
      - ./rulesets.toml:/base/snippets/rulesets.toml:ro
    restart: always
    labels:
      createdBy: Apps

networks:
  1panel-network:
    external: true
