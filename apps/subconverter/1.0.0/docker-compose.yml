services:
  subconverter:
    image: tindy2013/subconverter:latest
    container_name: ${CONTAINER_NAME}
    ports:
      - '127.0.0.1:${PANEL_APP_PORT_HTTP}:25500'
    networks:
      - 1panel-network
    volumes:
      - ./conf/pref.toml:/base/pref.toml
      - ./conf/auto_speed_test.ini:/base/config/auto_speed_test.ini
      - ./groups.toml:/base/snippets/groups.toml:ro
      - ./rulesets.toml:/base/snippets/rulesets.toml:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:25500/version
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      createdBy: Apps

networks:
  1panel-network:
    external: true
